apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: aiops-lab
  labels: {aiops-scenario: "01"}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web, aiops-scenario: "01"}}
    spec:
      containers:
        - name: web
          image: nginx:1.277 # typo: this tag doesn't exist (1.27 does)
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
