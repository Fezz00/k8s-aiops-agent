[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-aiops-agent"
version = "0.1.0"
description = "An agent that explains problems in a Kubernetes cluster"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27", # HTTP calls to Ollama and Prometheus
]

[project.optional-dependencies]
# Tools for development and CI: pip install -e ".[dev]"
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
aiops = "aiops.cli:main" # the "aiops" command; cli.py comes in Phase 2

[tool.setuptools]
packages = ["aiops"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/W = style errors, F = real bugs (unused imports, undefined names), I = import order
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
